name: Sass Legal CI

on:
  push:
    branches: [ main, develop ] # Or your primary branches
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"] # Test against multiple Python versions

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Updated to v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4 # Updated to v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # If you had a requirements-dev.txt, you would install it here:
        # pip install -r requirements-dev.txt
        echo "Downloading spaCy model fr_core_news_sm..."
        python -m spacy download fr_core_news_sm
        echo "spaCy model download completed."


    - name: Lint with Flake8
      run: |
        echo "Running Flake8 linting..."
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        # Increase max-line-length to something more modern if desired, e.g. 88 (Black default) or 99.
        # For now, sticking to 127 as per original request.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        echo "Flake8 linting completed."

    - name: Check formatting with Black
      run: |
        echo "Running Black format check..."
        black --check .
        echo "Black format check completed."

    - name: Test with Pytest
      run: |
        echo "Running Pytest..."
        python -m pytest
        echo "Pytest completed."

